<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" width="960" height="572" role="img"><title>SOC detection coverage</title><rect width="960" height="572" rx="14" fill="#0d1117"/><text x="36" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">SOC Detection Coverage</text><text x="36" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Seven use cases · lab thresholds · ATT&amp;CK used as context, not proof</text><text x="56" y="106" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8b949e">USE CASE</text><text x="318" y="106" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8b949e">CORE SPL LOGIC</text><text x="746" y="106" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8b949e">ATT&amp;CK</text><rect x="36" y="120" width="888" height="50" rx="9" fill="#161b22" stroke="#30363d"/><rect x="36" y="120" width="5" height="50" rx="2" fill="#58a6ff"/><text x="56" y="151" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#58a6ff">01</text><text x="88" y="151" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Failed login analysis</text><text x="318" y="151" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#e6edf3">"Failed password" · stats count by src_ip, user</text><text x="746" y="151" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">No direct mapping</text><rect x="36" y="178" width="888" height="50" rx="9" fill="#161b22" stroke="#30363d"/><rect x="36" y="178" width="5" height="50" rx="2" fill="#f85149"/><text x="56" y="209" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#f85149">02</text><text x="88" y="209" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Brute-force detection</text><text x="318" y="209" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#e6edf3">stats count by src_ip · where count &gt; 10</text><rect x="740" y="190" width="170" height="26" rx="13" fill="#0d1117" stroke="#f85149"/><text x="825" y="208" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f85149">T1110 Brute Force</text><rect x="36" y="236" width="888" height="50" rx="9" fill="#161b22" stroke="#30363d"/><rect x="36" y="236" width="5" height="50" rx="2" fill="#f85149"/><text x="56" y="267" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#f85149">03</text><text x="88" y="267" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Successful login review</text><text x="318" y="267" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#e6edf3">"Accepted password" · stats count by user src_ip</text><rect x="740" y="248" width="170" height="26" rx="13" fill="#0d1117" stroke="#f85149"/><text x="825" y="266" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f85149">T1078 Valid Accounts</text><rect x="36" y="294" width="888" height="50" rx="9" fill="#161b22" stroke="#30363d"/><rect x="36" y="294" width="5" height="50" rx="2" fill="#f85149"/><text x="56" y="325" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#f85149">04</text><text x="88" y="325" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Suspicious PowerShell</text><text x="318" y="325" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#e6edf3">-enc · Bypass · Hidden · DownloadFile · Net.WebClient</text><rect x="740" y="306" width="170" height="26" rx="13" fill="#0d1117" stroke="#f85149"/><text x="825" y="324" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f85149">T1059.001 PowerShell</text><rect x="36" y="352" width="888" height="50" rx="9" fill="#161b22" stroke="#30363d"/><rect x="36" y="352" width="5" height="50" rx="2" fill="#bc8cff"/><text x="56" y="383" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#bc8cff">05</text><text x="88" y="383" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Suspicious process execution</text><text x="318" y="383" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#e6edf3">parent_process=winword.exe → powershell.exe</text><text x="746" y="383" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">No direct mapping</text><rect x="36" y="410" width="888" height="50" rx="9" fill="#161b22" stroke="#30363d"/><rect x="36" y="410" width="5" height="50" rx="2" fill="#bc8cff"/><text x="56" y="441" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#bc8cff">06</text><text x="88" y="441" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Rare process hunting</text><text x="318" y="441" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#e6edf3">rare process_name · stats count by process_name</text><text x="746" y="441" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">No direct mapping</text><rect x="36" y="468" width="888" height="50" rx="9" fill="#161b22" stroke="#30363d"/><rect x="36" y="468" width="5" height="50" rx="2" fill="#d29922"/><text x="56" y="499" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#d29922">07</text><text x="88" y="499" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Network anomalies</text><text x="318" y="499" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#e6edf3">dc(dest_port) &gt; 20 · count &gt; 1000 by src_ip</text><text x="746" y="499" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">No direct mapping</text><text x="36" y="548" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Thresholds are lab examples and must be baselined and tuned before production use.</text></svg>